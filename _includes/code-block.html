<div class="code-container" style="position: relative; background: #272822; padding: 10px; border-radius: 5px; margin: 10px 0;" markdown="0">
  <button class="copy-btn" onclick="copyCode(this)" style="position: absolute; right: 10px; top: 10px; background: #444; color: #fff; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Copy</button>
  <pre style="margin: 0; background-color: black;"><code class="language-bash">{{ include.code | strip }}</code></pre>
